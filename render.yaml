databases:
  - name: ai-trading-coach-db
    plan: free
    databaseName: ai_trading_coach
    user: ai_trading_coach_user

services:
  - type: web
    plan: free
    name: ai-trading-coach
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-trading-coach-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
